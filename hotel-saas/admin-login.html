<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вхід до панелі керування — ЛОРНЕТ</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0f0a0d;
    --ink-2:#1d1116;
    --brass:#d9b45c;
    --brass-light:#f4dfa0;
    --brass-dim:#9c7a34;
    --cream:#f1e8d6;
    --stone:#a1937d;
    --hair:rgba(217,180,92,0.28);
    --gold-glow:0 0 0 1px rgba(217,180,92,0.35), 0 18px 50px rgba(0,0,0,0.55);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:
      radial-gradient(ellipse 70% 40% at 50% 0%, rgba(107,15,34,0.28), transparent 60%),
      var(--ink);
    color:var(--cream);
    font-family:'Jost',sans-serif;
    font-weight:300;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .login-card{
    background:var(--ink-2);
    border:1px solid var(--hair);
    padding:3rem 2.5rem;
    width:100%;
    max-width:420px;
    box-shadow:var(--gold-glow);
    position:relative;
  }
  .login-card::before, .login-card::after {
    content:'';
    position:absolute;
    width:16px; height:16px;
    border:1px solid var(--brass);
  }
  .login-card::before{top:-6px;left:-6px;border-right:none;border-bottom:none;}
  .login-card::after{top:-6px;right:-6px;border-left:none;border-bottom:none;}
  
  .logo{
    font-family:'Fraunces',serif;
    font-size:1.2rem;
    letter-spacing:0.28em;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0.6rem;
    color:var(--cream);
    margin-bottom:2rem;
  }
  .logo .crown{color:var(--brass);font-size:1rem;}
  
  h1{
    font-family:'Fraunces',serif;
    font-size:1.8rem;
    font-weight:400;
    text-align:center;
    color:var(--brass);
    margin-bottom:0.5rem;
  }
  p.subtitle{
    text-align:center;
    color:var(--stone);
    font-size:0.85rem;
    margin-bottom:2rem;
    letter-spacing:0.05em;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:0.5rem;
    margin-bottom:1.4rem;
  }
  .field label{
    font-size:0.68rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--stone);
  }
  .field input{
    background:transparent;
    border:none;
    border-bottom:1px solid var(--hair);
    color:var(--cream);
    font-family:'Jost',sans-serif;
    font-size:0.95rem;
    padding:0.6rem 0;
    outline:none;
    transition:border-color 0.25s;
  }
  .field input:focus{border-color:var(--brass);}
  
  .btn-primary{
    width:100%;
    margin-top:1rem;
    background:linear-gradient(135deg, var(--brass-light), var(--brass) 45%, var(--brass-dim));
    color:var(--ink);
    padding:0.95rem;
    font-size:0.78rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    border:1px solid var(--brass-light);
    cursor:pointer;
    transition:all 0.25s;
    font-family:'Jost',sans-serif;
    font-weight:500;
  }
  .btn-primary:hover{
    box-shadow:0 6px 20px rgba(217,180,92,0.35);
    transform:translateY(-1px);
  }
  .error-msg{
    color:#ff6b6b;
    font-size:0.85rem;
    text-align:center;
    margin-top:1rem;
    display:none;
  }
  .back-link{
    display:block;
    text-align:center;
    margin-top:1.5rem;
    font-size:0.75rem;
    color:var(--stone);
    letter-spacing:0.1em;
    text-transform:uppercase;
    text-decoration:none;
    transition:color 0.25s;
  }
  .back-link:hover{color:var(--brass);}
</style>
</head>
<body>

  <div class="login-card">
    <div class="logo"><span class="crown">&#9813;</span>ЛОРНЕТ</div>
    <h1>Адміністративна панель</h1>
    <p class="subtitle">Будь ласка, авторизуйтеся</p>

    <form id="loginForm">
      <div class="field">
        <label for="username">Логін</label>
        <input type="text" id="username" placeholder="Введіть логін" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary">Увійти</button>
      <div class="error-msg" id="errorMsg">Неправильний логін або пароль</div>
    </form>

    <a href="index.html" class="back-link">&#8592; Повернутися на сайт</a>
  </div>

  <script>
    const BACKEND_URL = 'https://portfolio-jvl5.onrender.com';

    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';

      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;

      try {
        const response = await fetch(`${BACKEND_URL}/api/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass })
        });

        const result = await response.json();

        if (response.ok) {
          // Зберігаємо маркер успішного входу у пам'яті браузера
          localStorage.setItem('admin_logged', 'true');
          // Перенаправляємо на сторінку таблиці бронювань
          window.location.href = 'admin.html';
        } else {
          errorMsg.textContent = result.error || 'Помилка авторизації';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = 'Не вдалося підключитися до сервера';
        errorMsg.style.display = 'block';
      }
    });
  </script>

</body>
</html>
